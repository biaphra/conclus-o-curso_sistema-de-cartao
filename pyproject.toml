[tool.poetry]
name = "desafio"
version = "0.1.0"
description = "Portal seguro para solicitação e acompanhamento de cartões"
authors = ["Guilherme Carvalho <gui.ifsp11@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "~5.0.4"
django-widget-tweaks = "~1.5.0"
psycopg = {version = "^3.2", extras = ["binary"]}
gunicorn = "^23.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.6"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
