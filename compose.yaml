services:
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports: ["8000:8000"]
    environment:
      DEBUG: "False"
      SECRET_KEY: "development-compose-key-change-before-production-123456789"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: "postgresql://dio:dio@db:5432/dio_bank"
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dio_bank
      POSTGRES_USER: dio
      POSTGRES_PASSWORD: dio
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:
